name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check all sources parse
        run: |
          for f in src/main.js src/preload.js src/renderer/*.js build/make-icon.js; do
            node --check "$f"
          done
      - name: Icon generator produces a valid 1024x1024 PNG
        run: |
          npm run icon
          node -e "
            const b = require('fs').readFileSync('build/icon.png');
            if (b.subarray(0,8).toString('hex') !== '89504e470d0a1a0a') throw new Error('not a PNG');
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20);
            if (w !== 1024 || h !== 1024) throw new Error('unexpected size ' + w + 'x' + h);
            console.log('icon OK', w + 'x' + h, b.length + ' bytes');
          "

  build:
    name: ${{ matrix.name }}
    needs: check
    # Installers take minutes to build, so only on a tag or a manual run.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (.dmg)
            artifacts: dist/*.dmg
          - os: windows-latest
            name: Windows (.exe)
            artifacts: dist/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Never publish from inside the matrix: two runners racing to create the
      # same GitHub Release produces two competing drafts. The release job
      # below collects everything and publishes exactly once.
      - name: Build installer
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected installers
        run: ls -lh artifacts

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/* \
          || gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            artifacts/*
